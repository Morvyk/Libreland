# xdg-desktop-portal backend routing for Libreland.
#
# Libreland ships its own backend — libreland-xdg-desktop-portal — covering
# everything a desktop needs: screen sharing and screenshots (through the
# compositor's own screencopy, into PipeWire), the file chooser, appearance
# settings, notifications, global shortcuts, printing, and the long tail. So
# there is exactly one backend to route to, and nothing to configure.
#
# Install to one of:
#   ~/.config/xdg-desktop-portal/libreland-portals.conf   (per-user)
#   /usr/share/xdg-desktop-portal/libreland-portals.conf  (system; the
#                                                          package does this)
#
# It is selected when XDG_CURRENT_DESKTOP contains "libreland", which the
# compositor sets for its own session and exports to the D-Bus activation
# environment — so no manual env is needed.
#
# Required at runtime:
#   xdg-desktop-portal   the frontend daemon apps actually talk to
#   pipewire             the transport screen sharing is defined in terms of
#
# To hand one interface to a different backend — say you install
# xdg-desktop-portal-gtk for its full print dialog — name it per interface:
#   org.freedesktop.impl.portal.Print=gtk

[preferred]
default=libreland
